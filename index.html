<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WizardCCNA — the complete CCNA 200-301 course: study plan, slides, flashcards, labs and practice exams." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>WizardCCNA</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem('wizardccna-settings') || '{}');
        var theme = (t.state && t.state.theme) || 'system';
        if (theme !== 'system') document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
