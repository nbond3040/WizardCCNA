name: Build desktop apps

# Builds the desktop edition of WizardCCNA (Electron):
#   Windows - WizardCCNA-Setup-<version>.exe      installer (choose folder, shortcuts, uninstaller)
#             WizardCCNA-Portable-<version>.exe   single file, no install
#   Linux   - WizardCCNA-<version>-x86_64.rpm        Fedora / RHEL (the RPM is installed and smoke-tested in a Fedora container)
#             WizardCCNA-<version>-x86_64.AppImage   any distro
#             WizardCCNA-<version>-x86_64.tar.gz     unpack and run
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.0 to also attach the files to a GitHub Release.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # only used to attach the .exe files to a release when a tag is pushed

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Build the web app
        run: |
          npm ci
          npm run build

      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          npm pkg set "version=$v"

      - name: Package the Windows app
        working-directory: desktop
        run: |
          npm ci
          npm run dist

      - name: Upload the installer and portable exe
        uses: actions/upload-artifact@v4
        with:
          name: WizardCCNA-windows
          path: |
            desktop/release/*.exe
          if-no-files-found: error

      # Starts the real packaged exe, loads the dashboard, a lesson, the practice page and a lab, and fails on any error.
      - name: Smoke test the packaged app
        working-directory: desktop
        shell: pwsh
        env:
          WIZARDCCNA_SMOKE_OUT: ${{ github.workspace }}\desktop\release\smoke-result.txt
          WIZARDCCNA_SMOKE_SHOT: ${{ github.workspace }}\desktop\release\smoke-dashboard.png
        run: |
          $p = Start-Process -FilePath "release\win-unpacked\WizardCCNA.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error "Smoke test timed out"; exit 1 }
          if (Test-Path release\smoke-result.txt) { Get-Content release\smoke-result.txt }
          if ($p.ExitCode -ne 0) { Write-Error "Smoke test failed (exit code $($p.ExitCode))"; exit 1 }

      - name: Upload the smoke test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: |
            desktop/release/smoke-result.txt
            desktop/release/smoke-dashboard.png
          if-no-files-found: ignore

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Build the web app
        run: |
          npm ci
          npm run build

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm xvfb

      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        run: npm pkg set "version=${GITHUB_REF_NAME#v}"

      - name: Package the Linux app (rpm, AppImage, tar.gz)
        working-directory: desktop
        run: |
          npm ci
          npm run dist:linux

      - name: Upload the Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: WizardCCNA-linux
          path: |
            desktop/release/*.rpm
            desktop/release/*.AppImage
            desktop/release/*.tar.gz
          if-no-files-found: error

      - name: Smoke test the unpacked app
        working-directory: desktop
        env:
          WIZARDCCNA_SMOKE_OUT: ${{ github.workspace }}/desktop/release/smoke-linux.txt
        run: xvfb-run -a --server-args="-screen 0 1440x900x24" release/linux-unpacked/wizardccna --smoke-test --no-sandbox

      # Real Fedora userland: install the RPM with dnf (pulling its dependencies) and run the same checks.
      - name: Install the RPM on Fedora and smoke test it
        run: |
          docker run --rm -v "$PWD/desktop/release:/pkg:ro" fedora:latest bash -euxc '
            dnf install -y /pkg/WizardCCNA-*.rpm xorg-x11-server-Xvfb dbus-x11 mesa-dri-drivers
            rpm -qi wizardccna | head -12
            WIZARDCCNA_SMOKE_OUT=/tmp/result.txt xvfb-run -a --server-args="-screen 0 1440x900x24" wizardccna --smoke-test --no-sandbox
            cat /tmp/result.txt'

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.rpm
            desktop/release/*.AppImage
            desktop/release/*.tar.gz
